[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rastpo"
version = "0.2.0"
description = "Regularization-aligned sparse portfolio optimization and paper experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.4", "scipy>=1.17", "pandas>=3", "pyarrow>=25", "torch>=2.11", "cvxpy>=1.9", "scs>=3.2", "yfinance>=1.7,<2"]

[tool.setuptools.packages.find]
where = ["src"]
